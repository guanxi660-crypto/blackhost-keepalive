name: blackhost-keepalive

# 6 小时一跳。点过续期就重置满 8h（不叠加）：跳点早到就在浏览器里等按钮亮，晚到直接点，
# 每跳都续上 → 无挂起、无限 +8h。
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "无视 2 小时窗口直接跑浏览器（调试用）"
        required: false
        default: false
        type: boolean

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # GITHUB_TOKEN 默认只读，删运行记录需要 actions:write
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests 'requests[socks]' playwright
          python -m playwright install --with-deps firefox

      # 配了 BH_NODE_LINK（分享链接）才需要 sing-box；renew.py 自己解析链接、生成配置、拉起进程
      - name: Probe node link secret
        env:
          BH_NODE_LINK: ${{ secrets.BH_NODE_LINK }}
        run: |
          if [ -n "$BH_NODE_LINK" ]; then
            echo "HAS_NODELINK=true" >> "$GITHUB_ENV"
          else
            echo "HAS_NODELINK=false" >> "$GITHUB_ENV"
          fi

      - name: Install sing-box
        if: env.HAS_NODELINK == 'true'
        run: |
          VER=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '[.[] | select(.prerelease==false)][0].tag_name' | sed 's/^v//')
          VER=${VER:-1.13.16}
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" | tar -xz --strip-components=1
          ./sing-box version

      - name: Renew
        env:
          BH_PAT: ${{ secrets.BH_PAT }}
          BH_COOKIE_HEADER: ${{ secrets.BH_COOKIE_HEADER }}
          BH_NODE_LINK: ${{ secrets.BH_NODE_LINK }}
          BH_TG_TOKEN: ${{ secrets.BH_TG_TOKEN }}
          BH_TG_CHAT: ${{ secrets.BH_TG_CHAT }}
        run: |
          mkdir -p artifacts
          if [ "${{ inputs.force }}" = "true" ]; then
            python renew.py --force
          else
            python renew.py
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhost-keepalive-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

      # 只留最近一条运行记录，其余删掉
      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=${{ github.run_id }}
          page=1
          while : ; do
            ids=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100&page=$page" \
              --jq ".workflow_runs[] | select(.id != $KEEP) | .id")
            [ -z "$ids" ] && break
            for id in $ids; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null 2>&1 || true
            done
            page=$((page+1))
            [ "$page" -gt 5 ] && break
          done
          echo "pruned, kept run $KEEP"
