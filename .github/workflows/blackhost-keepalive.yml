name: blackhost-keepalive

# 按会话到期点对齐：当前到期 12:28:45Z，续期窗口在到期前 2h（10:28:45Z）开启；
# 窗口内续期 +8h，下一个窗口 = +6h，所以 cron 固定在 :28 每 6 小时
on:
  schedule:
    - cron: "28 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Force power cycle (stop -> start)
        env:
          BH_PAT: ${{ secrets.BH_PAT }}
          BH_TG_TOKEN: ${{ secrets.BH_TG_TOKEN }}
          BH_TG_CHAT: ${{ secrets.BH_TG_CHAT }}
        run: python github-action/power_cycle.py
